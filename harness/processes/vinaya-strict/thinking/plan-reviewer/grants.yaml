role: plan-reviewer
# The seat reads and searches the code with its file-reading tools and does nothing else: no write, no code
# execution, no shell command of its own, no network, no install. Like the code reviewer, it holds no shell;
# the Claude Read/Grep/Glob tools and Codex's reading commands under a read-only sandbox are its whole reach.
# Per vendor only because a model id names one vendor's model; process-supplied leaves it to the run.
models: { claude: process-supplied, codex: process-supplied }
capabilities:
  read_files: allow
  run_commands: deny
  write_files: deny
  network: []
  web_fetch: deny
  web_search: deny
  subagents: deny
  plan_tool: allow
  view_image: allow
mcp_tools: {}
hooks: { background_shell: true, force_push: true, no_verify: true, default_branch_commit: true, write_scope: true }
sandbox: enabled
