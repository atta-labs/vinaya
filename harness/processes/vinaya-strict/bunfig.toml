[test]
timeout = 30000
# The kernel preload's private runtime directory and environment hygiene, then the Vinaya configuration provider and Log sink factory.
preload = "./integration/test-preload.ts"

# Every run writes a JUnit report; the kernel test preload points this fixed path at the run's own report file
# (`harness/kernel/gates/ring0-hooks/pre-push/junit-store.ts`), which a later selection reads as earlier passes.
[test.reporter]
junit = "../../../node_modules/.vinaya-junit/harness-processes-vinaya-strict.xml"
