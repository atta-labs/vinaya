# On every push to main, changesets/action checks for pending changeset
# files and, if any exist, opens/updates a "Version Packages" PR that runs
# `changeset version` — see apps/cli/specs/self-hosting.md § How the
# published version is produced for why @changesets/config's `fixed` group
# is what makes that plan bump @attalabs/vinaya alongside an engine package,
# something Changesets' default devDependency-blind cascade cannot do.
#
# No `publish` input is given, so the action only ever opens that PR — it
# never runs `npm publish`. Publishing (the `publish` command and the npm
# token this job would need) is a separate, later addition.

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    # Nothing in this job spends `GITHUB_TOKEN` any more — both the branch
    # push and the API calls run on `RELEASE_TOKEN` (see the step below).
    # `contents: read` is what checkout would need if it fell back to the
    # default token; declaring the writes it no longer uses would misstate
    # which credential does what.
    permissions:
      contents: read
    steps:
      # `token:` is load-bearing, not tidiness. Without it checkout persists
      # `GITHUB_TOKEN` as an `http.extraheader` in `.git/config`, and that
      # header wins over any credential the changesets action supplies for
      # its own `git push` — so the release branch would be pushed by
      # `GITHUB_TOKEN` even though the PR was created by `RELEASE_TOKEN`.
      #
      # GitHub does not trigger workflows on pushes made with `GITHUB_TOKEN`.
      # The first Version Packages PR would get its checks (creation is a
      # `RELEASE_TOKEN` act), and then every later force-push to that same
      # branch would arrive as a `synchronize` with a new head SHA and zero
      # required check runs against it — permanently unmergeable, with no
      # error anywhere. That is the same silent-stall shape this workflow
      # already failed in once, and with changesets landing in batches,
      # force-pushing an open Version Packages PR is the steady state, not
      # the edge case.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned to a commit, not the mutable `v1` tag — this action holds
      # `RELEASE_TOKEN`, a credential with contents and pull-requests write
      # on this repository, and it holds it on pushes to main. That is the
      # same third-party-action trust bar `oven-sh/setup-bun` is held to
      # elsewhere in this repo's workflows, and it is set by the token the
      # step is handed rather than by the `permissions:` block, which now
      # grants `GITHUB_TOKEN` nothing this job spends. Resolved from the
      # `v1.9.0` tag on 2026-08-15.
      # `RELEASE_TOKEN`, not `GITHUB_TOKEN`, and only for this step's API
      # calls. The `atta-labs` organization sets its member repositories'
      # default workflow permissions to read and leaves "Allow GitHub Actions
      # to create and approve pull requests" off, so `GITHUB_TOKEN` cannot
      # call the create-pull-request endpoint here — the job's own
      # `permissions:` block cannot grant past the organization ceiling. Every
      # run from 2026-08-15 onward did the whole version plan, committed it,
      # force-pushed `changeset-release/main`, and then failed on that one
      # call with "GitHub Actions is not permitted to create or approve pull
      # requests", leaving the release branch correct and no PR to merge.
      #
      # The organization setting is deliberately left alone: that single
      # checkbox grants create *and* approve to every workflow in every
      # `atta-labs` repository, and an Actions run able to submit approving
      # reviews is the one grant that could hollow out this repo's own review
      # gate. `RELEASE_TOKEN` is a fine-grained token scoped to this
      # repository alone, with contents and pull-requests write and nothing
      # else, so it buys back PR creation without buying approval.
      #
      # This `env` covers the action's API calls. Its `git push` of the
      # release branch runs on the same token by a different route — the
      # `token:` given to checkout above, persisted into `.git/config`.
      - name: Open/update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: bun run changeset:version
          # This repo's commit convention is `Type(scope): Description`, and
          # the action's defaults ("Version Packages" for both) do not meet
          # it. Nothing mechanically rejects them — there is no commitlint
          # here, deliberately — so the convention holds only where it is
          # actually set, and this is the one commit no human writes.
          #
          # `setupGitUser` is left at its default on purpose: the commit stays
          # authored by `github-actions[bot]`, because a machine did write it.
          # The MESSAGE should follow the convention; the AUTHOR should stay
          # honest about what produced the commit.
          commit: 'Chore(release): Version packages'
          title: 'Chore(release): Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
