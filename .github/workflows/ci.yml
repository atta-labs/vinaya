# This repo's own ring-1 lint/typecheck/test gate — hand-written, not
# vinaya-generated, not vinaya-managed, invisible to `doctor` by design.
# The four vinaya-*.yml workflows in this directory run `vinaya check` /
# `archive` / `audit`; none of them ever ran a test or a typecheck (#933).
#
# Runs unscoped (no --affected, no --filter): the suite is ~1-2 minutes and
# scoping has hidden failures here before.
#
# The `build` job also builds the CLI once and uploads it as the
# `vinaya-cli-dist` artifact (O2) — the exact name `CLI_DIST_ARTIFACT_NAME` in
# `apps/cli/src/lib/artifacts.ts` names — so the sibling `pull_request`
# workflow `vinaya-checks.yml` downloads it instead of building its own copy.
# Both run at the same trust level (untrusted PR content), so sharing here
# crosses no boundary; see `apps/cli/specs/self-hosting.md`. The build and
# upload always run, even on a docs-only diff, because `vinaya-checks.yml`
# needs the artifact regardless of whether the test jobs below ran.
#
# The apps/cli suite (by far the largest — 123 files, on
# the order of 2000 tests) is sharded across three jobs (`test-cli`, a
# `matrix.shard` of 1..3), each running an explicit, pre-measured-balanced
# file list (`apps/cli/tests/ci-shards/shard-<n>.txt`, one path per line,
# `apps/cli/tests/ci-shards.test.ts` proving the three lists union to
# exactly the files on disk, none dropped or duplicated) — never a directory
# split, which would concentrate this suite's few genuinely slow files
# (`dispatch.test.ts`, `quickstart.test.ts`, `demo.test.ts`) whichever
# directory happens to hold them, defeating the balance a shard exists to
# provide. `aggregate` is the one job branch protection should require: it
# depends on every other job here and is the sole "Vinaya CI" name, so
# sharding the work never means sharding the required check.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The default branch is the one place every merged tree must be evaluated
  # together. Keep this unfiltered: even a docs-only merge runs the complete
  # suite on the commit that actually landed.
  push:
    branches: [main]

# Pull-request runs are keyed on the PR alone — deliberately NOT the head SHA, unlike the
# vinaya-managed `pull_request`/`pull_request_target` workflows in this
# directory (`vinaya-checks.yml`, `vinaya-review.yml`,
# `vinaya-body-checks.yml`; see `apps/cli/specs/self-hosting.md`'s "One run
# per pull request"). Those key on PR+head because each run judges THAT
# commit and a later push's rerun of an earlier commit's run must not
# collide with the current commit's own run. This workflow does the opposite
# on purpose: it is the expensive suite (build + typecheck + test, now
# sharded — O3), and a superseded push's copy of it is pure waste nobody will
# ever read once a newer push exists. Cancelling it costs nothing: the newer
# push's own run re-covers the same ground from a fresher head. Default-branch
# runs instead use their commit SHA: each merge keeps its own result, and a
# later merge cannot cancel that result while it is in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, lint & typecheck
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
      config_changed: ${{ steps.docs-only.outputs.config_changed }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several aeg-core tests (the coherence oracle's
          # golden-comparison and origin/main diffing) resolve `origin/main`
          # as a real ref — the default shallow, single-branch checkout
          # never fetches it, and those tests fail with "origin/main does
          # not resolve" even though they pass locally. Unrelated to
          # --affected (this job stays unscoped) — needed regardless. It also
          # gives the docs-only diff check below a real `base.sha` to diff
          # against.
          fetch-depth: 0
          persist-credentials: false

      # O4: a diff touching only `**/*.md`, `.changeset/**`, and
      # `aeg-root/**` doc files skips lint/typecheck/test below (never the
      # CLI build/upload two steps down, which every PR's `vinaya-checks.yml`
      # depends on regardless). Reports a real "true" on this job's own check
      # run rather than a `skipped` job — this job's `if:` is never false.
      - name: Detect docs-only diff
        id: docs-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # A push has no pull-request base SHA. More importantly, the default
          # branch is intentionally never narrowed: every merged commit runs
          # lint, typecheck, every test shard, and sandbox conformance.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          NON_DOCS=$(echo "$CHANGED" | grep -vE '\.md$|^\.changeset/|^aeg-root/' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          # O1/O3: whether this PR's diff touches the ROOT vinaya.config.json
          # exactly — never a `vinaya.config.json` written inside a fixture
          # directory, the same one-path discrimination the pre-push test
          # selector applies (apps/cli/specs/self-hosting.md). Gates the
          # `test-cli-config-anchor` job below; false for every other PR, so
          # those run exactly as before.
          if echo "$CHANGED" | grep -qxF 'vinaya.config.json'; then
            echo "config_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The doctor step below runs the built CLI with `node` on the runner's
      # own Node; the CLI's floor is 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # O1: restores Bun's install cache, keyed on the lockfile, before the
      # install below — same key shape `bunInstallCacheStep()`
      # (`apps/cli/src/lib/artifacts.ts`) emits in every generated workflow,
      # so this job and `vinaya-checks.yml`'s install (when it has one)
      # share one cache entry per lockfile per commit.
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # O2: built once here, uploaded below, and downloaded by
      # `vinaya-checks.yml` instead of that workflow building its own copy.
      # Always runs, docs-only diff or not — see the header note.
      - name: Build the Vinaya CLI
        run: bun run --cwd apps/cli build

      - name: Upload the shared CLI build
        uses: actions/upload-artifact@v4
        with:
          name: vinaya-cli-dist
          path: apps/cli/dist
          retention-days: 1

      # `actions/checkout` produces a fresh clone with no local git config,
      # so `core.hooksPath` is never set here the way a real contributor's
      # machine has it after `vinaya init`/`vinaya upgrade` — doctor's own
      # `[hooks]` finding correctly reads that as ring 0 being inert and
      # errors on every run otherwise (measured live: PR #539's first CI
      # run). Arming it here is the exact one-line remedy doctor itself
      # prints, makes the finding true for this checkout, and is harmless —
      # no step in this job makes a commit or push for a hook to fire on.
      - name: Arm this checkout's git hooks routing
        run: git config core.hooksPath .vinaya/hooks

      # task 17, O5: `vinaya doctor` diagnoses drift between this repo's own
      # managed files (the four `vinaya-*.yml` workflows, git hooks) and the
      # generator that produced them (`apps/cli/src/lib/artifacts.ts`) —
      # read-only, never mutates. Runs the CLI just built above (never a
      # stale published `vinaya` on the runner) against THIS repo, the same
      # one `vinaya init` installed into. A generator change that ships with
      # no regenerated file is exactly the gap this closes: `#529` changed the
      # review-workflow generator and merged without regenerating
      # `.github/workflows/vinaya-review.yml`, and nothing ran `doctor` to
      # catch it. Unconditional (not gated behind the docs-only skip above):
      # a drifted managed file is a fact about the tree, independent of
      # whether THIS diff happens to also touch docs.
      #
      # `GH_TOKEN` here for the same reason the Test step below sets it:
      # doctor's own `[environment]` check shells to `gh auth status`, which
      # `gh` fails with no token on the runner — `warn`/`error` findings
      # flip doctor's exit code (measured live: PR #539's second CI run,
      # ring 0 armed above, `gh` still red). The job token is a real,
      # valid `gh` credential here, exactly like the Test step already
      # relies on; this makes the finding true instead of suppressing it.
      - name: vinaya doctor — managed files match their generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/cli/dist/index.js doctor

      # Biome was a devDependency every contributor already installed, and
      # nothing ever ran it — so formatting and lint drifted in whenever a
      # contributor did not run it by hand. `check` is formatter + linter in
      # one pass over the whole repo; it takes ~150ms, so there is no reason
      # to scope it. Deliberately BEFORE typecheck: a formatting failure is
      # the cheapest and most mechanical one to read, and reporting it first
      # keeps it from being buried under type errors.
      #
      # No `--write` here. CI reports; the contributor fixes with
      # `bunx biome check --write .` locally. A CI job that rewrites the tree
      # would be pushing to a PR branch, which is not this gate's job.
      - name: Lint and format
        if: steps.docs-only.outputs.docs_only != 'true'
        run: bunx biome check .

      - name: Typecheck
        if: steps.docs-only.outputs.docs_only != 'true'
        run: bunx turbo typecheck

      - name: Docs-only skip report
        if: steps.docs-only.outputs.docs_only == 'true'
        run: echo "Docs-only diff (**/*.md, .changeset/**, aeg-root/**) — lint/typecheck/test skipped." >> "$GITHUB_STEP_SUMMARY"

  # Every workspace package except `@attalabs/vinaya` (apps/cli) — that one
  # is by far the largest and is sharded below (O3). `--concurrency=1`
  # carries forward from this job's own pre-shard history (`#438`): running
  # every package's own test task at once starved shared subprocess-spawning
  # tests of resources, five distinct tests each failing once with an
  # identical empty-stderr signature, each passing standalone. That finding
  # was about CROSS-PACKAGE concurrency, not about sharding apps/cli's own
  # suite by file — unrelated axis, left exactly as it was.
  test-shared-packages:
    name: Test (shared packages)
    needs: build
    if: needs.build.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx turbo test --filter='!@attalabs/vinaya' --concurrency=1

  # apps/cli's own suite, split across three jobs by an
  # explicit, pre-measured-balanced file list — see this file's header
  # comment and `apps/cli/tests/ci-shards.test.ts`. Bypasses `turbo`/the
  # package's own `test` script (which has no notion of a file subset) and
  # calls `bun test` directly with that shard's file list, from `apps/cli`
  # — the same cwd `turbo` would have run it from, and the same
  # `--timeout=30000` the package's own script passes (`apps/cli/
  # package.json`), so a shard enforces the identical per-test ceiling the
  # unsharded suite always did.
  test-cli:
    name: Test (apps/cli, shard ${{ matrix.shard }})
    needs: build
    if: needs.build.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/cli
        run: bun test --timeout=30000 $(tr '\n' ' ' < tests/ci-shards/shard-${{ matrix.shard }}.txt)

  # O1/O2/O3 (Issue #783): the pre-merge trust-anchor probe. Runs ONLY when
  # this PR's diff touches the root `vinaya.config.json` (`config_changed`
  # above), and re-runs the whole apps/cli suite with the PR's OWN
  # configuration standing in for the default branch's — so a test that
  # depends on a trust-anchored setting (the `logs` destination, `runtimeDir`,
  # the review policy) fails HERE, on the PR, instead of passing and breaking
  # the default branch the moment it merges (the `logs.url` change observed
  # 2026-09-26). The mechanism is `config.ts`'s `resolveCiTrustAnchorProbeRef`:
  # it reads the config from `VINAYA_CI_CONFIG_PROBE_REF` (the checked-out PR)
  # instead of the real default branch, and does so ONLY when this exact job's
  # three conditions hold — the ref opt-in, the Actions runner marker, and no
  # forge credential. See `apps/cli/specs/self-hosting.md`, "Proving a
  # root-configuration change before merge".
  #
  # The security guarantee is this job's shape, not just the seam's gate:
  # `permissions: contents: read` and NO `secrets.*` / `GH_TOKEN` — so it holds
  # no repository secret and no forge-write credential, and nothing it runs can
  # redirect where a real unattended run or CI delivers logs or keeps its
  # runtime files (those reads happen in credentialed `pull_request_target`
  # jobs from the default branch, which never set the probe var). With the
  # probe active the trust-anchor read is served from the local checkout, so
  # dropping the token costs the suite nothing it needed.
  test-cli-config-anchor:
    name: Test (apps/cli, root-config probe, shard ${{ matrix.shard }})
    needs: build
    if: needs.build.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    env:
      # The checked-out ref stands in for the default branch. For a
      # `pull_request` event `actions/checkout` lands on the PR's merge commit,
      # so `HEAD:vinaya.config.json` is exactly this configuration as it will
      # exist once merged — which is what this job exists to prove.
      VINAYA_CI_CONFIG_PROBE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Deliberately no `GH_TOKEN` in this step's env — the probe read is local,
      # and the job must hold no forge credential (O2).
      - name: Test shard ${{ matrix.shard }} with the PR's config as the trust anchor
        working-directory: apps/cli
        run: bun test --timeout=30000 $(tr '\n' ' ' < tests/ci-shards/shard-${{ matrix.shard }}.txt)

  # The sandbox conformance suite (`apps/cli/tests/sandbox-conformance/`,
  # `apps/cli/specs/isolation.md`): every command the Developer doctrine and
  # the rendered brief name, run inside Claude Code's sandbox (the sandbox
  # runtime, via `bunx`) and inside Codex's (`codex sandbox`), each set up as
  # the driver sets up a confined dispatch. A command either exits 0 under
  # both or is in the suite's known-failures list, which only shrinks.
  #
  # Every pull request, docs-only included: a doctrine or brief-template
  # edit is exactly what adds a command to the list. No agent login — both
  # runtimes run a single command under their policy; the job token only
  # serves the suite's read-only `gh` lines.
  sandbox-conformance:
    name: Sandbox conformance (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # `origin/main` is a real ref the suite's `git diff`/`git log`
          # lines name.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # What both runtimes need on Linux: bubblewrap (both), socat and
      # ripgrep (the sandbox runtime). Ubuntu 24.04 strips capabilities from
      # unprivileged user namespaces by default, which bubblewrap needs —
      # the sandbox runtime's own README names this sysctl as the remedy.
      # Host setup only; neither sandbox's policy is touched.
      - name: Install the Linux sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The tools this repository's own checks need (`ci.setup`, today
      # gitleaks), as a Developer's machine has them — so `check --all`
      # inside a sandbox fails only on what the sandbox denies.
      - name: Install the checks' own tools
        run: bun -e 'process.stdout.write(require("./vinaya.config.json").ci.setup)' | bash
      - name: Run the suite under both sandboxes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VINAYA_SANDBOX_CONFORMANCE: '1'
        working-directory: apps/cli
        run: bun test --timeout=900000 tests/sandbox-conformance/sandbox-conformance.test.ts

  # The one job branch protection should require. Depends on every job
  # above and reports under the historical "Vinaya CI" name (`run-name`
  # left unset — the JOB name is what a required-check setting matches),
  # so sharding the work behind it never means sharding, renaming, or
  # multiplying the required check every adopter's branch protection
  # already keys on. `if: always()` — this must still run (and
  # fail loudly) when an upstream job fails, never be skipped alongside it.
  aggregate:
    name: Vinaya CI
    needs: [build, test-shared-packages, test-cli, test-cli-config-anchor, sandbox-conformance]
    if: always()
    runs-on: ubuntu-latest
    # Least-privilege, matching every other job in this file — this job does
    # no checkout and runs no PR-controlled content, so it needs no more than
    # the default read scope, made explicit rather than left implicit.
    permissions:
      contents: read
    steps:
      - name: Every upstream job succeeded or was correctly skipped (docs-only)
        run: |
          for result in "${{ needs.build.result }}" "${{ needs.test-shared-packages.result }}" "${{ needs.test-cli.result }}" "${{ needs.test-cli-config-anchor.result }}" "${{ needs.sandbox-conformance.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
