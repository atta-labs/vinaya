# This repo's own ring-1 lint/typecheck/test gate — hand-written, not
# vinaya-generated, not vinaya-managed, invisible to `doctor` by design.
# The four vinaya-*.yml workflows in this directory run `vinaya check` /
# `archive` / `audit`; none of them ever ran a test or a typecheck (#933).
#
# Every test the inventory (`scripts/test-suites/inventory.json`) records runs
# from one explicit schedule of files (`scripts/test-suites/schedule.ts`),
# each under its own native runner, working directory, preload and
# environment, in one place: a repository-owned test in the build job's
# inventory step, a CLI, kernel or process Bun test in one `test-cli` shard,
# every other suite in the shared-packages job. Each runner's own report must
# name exactly the files it was given.
#
# A push to `main` runs everything: every shard's whole schedule, every
# package and sandbox conformance, so a test a pull request's selection
# missed still runs once the pull request merges. A pull request runs what
# its change requires, decided once by one CI plan the build job computes
# (`scripts/ci/impact-plan.ts`, `apps/cli/specs/self-hosting.md`): the tests
# the shared selection library requires for the diff between the base and
# the tested merge commit, over the canonical test inventory — imports,
# declared inputs (fixtures, docs, configuration, workflow), folder scans,
# spawned programs, preloads, runner and lockfile inputs, with a named
# fallback for an input it cannot model — plus the always-run list and the
# repository suite as stated obligations. The same plan decides which
# packages to typecheck, which files to lint, and whether the root-config
# probe and the Linux sandbox suite run; each place runs the planned files it
# holds, plus `@attalabs/aeg-core` whole and the portal whole when the change
# touches it. The base commit's own guard (`scripts/ci/base-guard.ts`) runs
# everything when the change touches the planner, the inventory, the
# selection library, the schedule, a runner configuration or this workflow.
# The root-config probe job always runs whole shard lists.
#
# The apps/cli suite (by far the largest — on the order of 350 files and
# several thousand tests) is sharded across six jobs (`test-cli`, a
# `matrix.shard` of 1..6), each running an explicit file list, balanced by
# hand when it was measured (`apps/cli/tests/ci-shards/shard-<n>.txt`, one
# path per line, `apps/cli/tests/ci-shards.test.ts` proving the six lists
# union to exactly the files on disk, none dropped or duplicated) — never a
# directory split, which would concentrate this suite's few genuinely slow
# files (`dispatch.test.ts`, `quickstart.test.ts`, `demo.test.ts`) whichever
# directory happens to hold them, defeating the balance a shard exists to
# provide. The kernel's and the process's Bun tests join the same six jobs,
# balanced by file count, not by duration: each, in identity order, goes to
# the shard with the fewest files.
#
# `aggregate` is the one job branch protection should require: it depends on
# every other job here and is the sole "Vinaya CI" name, so sharding the work
# never means sharding the required check.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The default branch is the one place every merged tree must be evaluated
  # together. Keep this unfiltered: even a docs-only merge runs the complete
  # suite on the commit that actually landed.
  push:
    branches: [main]

# Pull-request runs are keyed on the PR alone — deliberately NOT the head SHA, unlike the
# vinaya-managed `pull_request`/`pull_request_target` workflows in this
# directory (`vinaya-checks.yml`, `vinaya-review.yml`,
# `vinaya-body-checks.yml`; see `apps/cli/specs/self-hosting.md`'s "One run
# per pull request"). Those key on PR+head because each run judges THAT
# commit and a later push's rerun of an earlier commit's run must not
# collide with the current commit's own run. This workflow does the opposite
# on purpose: it is the expensive suite (build + typecheck + test, now
# sharded — O3), and a superseded push's copy of it is pure waste nobody will
# ever read once a newer push exists. Cancelling it costs nothing: the newer
# push's own run re-covers the same ground from a fresher head. Default-branch
# runs instead use their commit SHA: each merge keeps its own result, and a
# later merge cannot cancel that result while it is in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, lint & typecheck
    runs-on: ubuntu-latest
    # The CI plan's decisions, read by every later job and by `aggregate`.
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
      config_changed: ${{ steps.plan.outputs.config_changed }}
      plan_identity: ${{ steps.plan.outputs.plan_identity }}
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      plan_scope: ${{ steps.plan.outputs.plan_scope }}
      plan_head: ${{ steps.plan.outputs.plan_head }}
      plan_tested: ${{ steps.plan.outputs.plan_tested }}
      guard_verdict: ${{ steps.plan.outputs.guard_verdict }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      decision: ${{ steps.plan.outputs.decision }}
      shadow_state: ${{ steps.plan.outputs.shadow_state }}
      shadow_jobs: ${{ steps.plan.outputs.shadow_jobs }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several aeg-core tests (the coherence oracle's
          # golden-comparison and origin/main diffing) resolve `origin/main`
          # as a real ref — the default shallow, single-branch checkout
          # never fetches it, and those tests fail with "origin/main does
          # not resolve" even though they pass locally. Unrelated to
          # --affected (this job stays unscoped) — needed regardless. It also
          # gives the docs-only diff check below a real `base.sha` to diff
          # against.
          fetch-depth: 0
          persist-credentials: false

      # Whether a diff touches only `**/*.md`, `.changeset/**`, and
      # `aeg-root/**` doc files — reported in this job's summary. What lint
      # and typecheck run is the CI plan's, below. Reports a real "true" on
      # this job's own check run rather than a `skipped` job — this job's
      # `if:` is never false.
      - name: Detect docs-only diff
        id: docs-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # A push has no pull-request base SHA. More importantly, the default
          # branch is intentionally never narrowed: every merged commit runs
          # lint, typecheck, every test shard, and sandbox conformance.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          NON_DOCS=$(echo "$CHANGED" | grep -vE '\.md$|^\.changeset/|^aeg-root/' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # The doctor step below runs the built CLI with `node` on the runner's
      # own Node; the CLI's floor is 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # O1: restores Bun's install cache, keyed on the lockfile, before the
      # install below — same key shape `bunInstallCacheStep()`
      # (`apps/cli/src/lib/artifacts.ts`) emits in every generated workflow,
      # so this job and `vinaya-checks.yml`'s install (when it has one)
      # share one cache entry per lockfile per commit.
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The CI plan (`scripts/ci/impact-plan.ts`): one plan bound to the base,
      # the approved pull-request head and the tested merge commit, deciding
      # what lint, typecheck, every test job and the conditional jobs run, and
      # checking with the real schedule that every planned test is placed
      # exactly once. Inside this job, so no job waits on another stage.
      #
      # The guard is the BASE commit's own `scripts/ci/base-guard.ts`, never
      # this pull request's: a change to the planner, the inventory, the
      # selection library, the schedule, a runner configuration or this
      # workflow runs everything, and no candidate code can exempt itself.
      # A base with no guard, or a guard that fails, gives no verdict, and no
      # verdict runs everything. This workflow is the pull request's own file,
      # so it cannot authenticate itself: the backstops for an edit to it are
      # the independent review, the full run of every default-branch commit
      # and the review loop's head-bound read of `Vinaya CI`. A push to
      # `main` plans everything, and also a shadow pull-request plan for
      # `aggregate` to compare failures against.
      - name: Build this pull request's CI plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          PLAN_DIR="$RUNNER_TEMP/ci-plan"
          mkdir -p "$PLAN_DIR"
          GUARD="$PLAN_DIR/guard.json"
          SHADOW=""
          if [ "$EVENT" = "pull_request" ]; then
            if git show "$BASE_SHA:scripts/ci/base-guard.ts" > "$PLAN_DIR/base-guard.ts" 2>/dev/null; then
              # From its own folder, so no configuration the pull request commits
              # (a `bunfig.toml` preload) loads into the process that judges it.
              (cd "$PLAN_DIR" && bun ./base-guard.ts --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$TESTED_SHA") > "$GUARD" || rm -f "$GUARD"
            else
              echo "The base commit holds no guard; everything runs." >&2
            fi
          else
            SHADOW="--shadow"
          fi
          bun scripts/ci/impact-plan.ts --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" --tested "$TESTED_SHA" --guard "$GUARD" $SHADOW --out-dir "$PLAN_DIR" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Build the Vinaya CLI
        run: bun run --cwd apps/cli build

      # `actions/checkout` produces a fresh clone with no local git config,
      # so `core.hooksPath` is never set here the way a real contributor's
      # machine has it after `vinaya init`/`vinaya upgrade` — doctor's own
      # `[hooks]` finding correctly reads that as ring 0 being inert and
      # errors on every run otherwise (measured live: PR #539's first CI
      # run). Arming it here is the exact one-line remedy doctor itself
      # prints, makes the finding true for this checkout, and is harmless —
      # no step in this job makes a commit or push for a hook to fire on.
      - name: Arm this checkout's git hooks routing
        run: git config core.hooksPath .vinaya/hooks

      # task 17, O5: `vinaya doctor` diagnoses drift between this repo's own
      # managed files (the four `vinaya-*.yml` workflows, git hooks) and the
      # generator that produced them (`apps/cli/src/lib/artifacts.ts`) —
      # read-only, never mutates. Runs the CLI just built above (never a
      # stale published `vinaya` on the runner) against THIS repo, the same
      # one `vinaya init` installed into. A generator change that ships with
      # no regenerated file is exactly the gap this closes: `#529` changed the
      # review-workflow generator and merged without regenerating
      # `.github/workflows/vinaya-review.yml`, and nothing ran `doctor` to
      # catch it. Unconditional (not gated behind the docs-only skip above):
      # a drifted managed file is a fact about the tree, independent of
      # whether THIS diff happens to also touch docs.
      #
      # `GH_TOKEN` here for the same reason the Test step below sets it:
      # doctor's own `[environment]` check shells to `gh auth status`, which
      # `gh` fails with no token on the runner — `warn`/`error` findings
      # flip doctor's exit code (measured live: PR #539's second CI run,
      # ring 0 armed above, `gh` still red). The job token is a real,
      # valid `gh` credential here, exactly like the Test step already
      # relies on; this makes the finding true instead of suppressing it.
      - name: vinaya doctor — managed files match their generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/cli/dist/index.js doctor

      # Biome was a devDependency every contributor already installed, and
      # nothing ever ran it — so formatting and lint drifted in whenever a
      # contributor did not run it by hand. `check` is formatter + linter in
      # one pass over the whole repo; it takes ~150ms, so there is no reason
      # to scope it. Deliberately BEFORE typecheck: a formatting failure is
      # the cheapest and most mechanical one to read, and reporting it first
      # keeps it from being buried under type errors.
      #
      # No `--write` here. CI reports; the contributor fixes with
      # `bunx biome check --write .` locally. A CI job that rewrites the tree
      # would be pushing to a PR branch, which is not this gate's job.
      #
      # The plan decides the scope: the changed files Biome checks, every file
      # when its configuration or installation changed, none when no changed
      # file is one it checks.
      - name: Lint and format
        if: steps.plan.outputs.lint_scope != 'skip'
        env:
          LINT_SCOPE: ${{ steps.plan.outputs.lint_scope }}
        run: |
          if [ "$LINT_SCOPE" = "all" ]; then
            bunx biome check .
          else
            xargs -d '\n' bunx biome check --files-ignore-unknown=true --no-errors-on-unmatched < "$RUNNER_TEMP/ci-plan/lint-files.txt"
          fi

      # The plan decides the packages: each one whose type program can see a
      # changed file, through a manifest dependency or a relative import
      # across its folder; `turbo` adds each one's `^typecheck`
      # prerequisites. Every package when a root manifest, the lockfile, the
      # task graph or a root compiler configuration changed.
      - name: Typecheck
        if: steps.plan.outputs.typecheck_scope != 'skip'
        env:
          TYPECHECK_SCOPE: ${{ steps.plan.outputs.typecheck_scope }}
        run: |
          if [ "$TYPECHECK_SCOPE" = "all" ]; then
            bunx turbo typecheck
          else
            bunx turbo typecheck $(sed 's/^/--filter=/' "$RUNNER_TEMP/ci-plan/typecheck-packages.txt")
          fi

      - name: Docs-only skip report
        if: steps.docs-only.outputs.docs_only == 'true'
        run: echo "Docs-only diff (**/*.md, .changeset/**, aeg-root/**) — lint/typecheck/test skipped." >> "$GITHUB_STEP_SUMMARY"

      # The counted architecture ratchet: the head tree's process and role
      # names in non-process code must equal the committed baseline, and that
      # baseline may not grow against the base commit's own baseline. Never
      # gated behind the docs-only skip: a docs-only change still runs it, and
      # this job carries no condition that skips it
      # (`harness/tests/architecture.test.ts` asserts both). A push to `main`
      # has no pull-request base, so it compares with the commit it replaced.
      - name: Test the architecture ratchet against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          (cd harness && bun test tests/architecture.test.ts)
          bun harness/tests/architecture-ratchet.ts --compare-base "$BASE_SHA"

      # The test inventory (`scripts/test-suites/inventory.json`): every
      # tracked test-shaped file must be owned by exactly one suite's native
      # runner or excluded with a reason, and the repository suite — the root
      # tests no workspace runs, the inventory's own tests and the relocation
      # proof among them — runs here, from the root, under the root
      # `bunfig.toml`. The list is the inventory's repository suite, written
      # out (`scripts/test-suites/inventory-check.test.ts` keeps the two
      # equal), never a discovery that could pick up fixture data. Never gated
      # behind the docs-only skip: a documentation-only pull request runs it,
      # and a failure fails this job and so the required check.
      - name: Check the test inventory and run the repository suite
        run: |
          bun scripts/test-suites/inventory-check.ts
          bun test ./scripts/vinaya-checks/ui-rules.test.ts ./scripts/vinaya-checks/process-version-bump.test.ts ./scripts/test-suites/inventory-check.test.ts ./scripts/test-suites/relocation-fixture.test.ts ./scripts/test-suites/schedule.test.ts ./scripts/test-suites/staged-driver-move.test.ts

      # When this job failed, print its own token budgets on one line for
      # the review loop (`apps/cli/specs/loop.md`). Reading them spends none.
      # The same step ends every job in this file; the limits step after it
      # follows it in the build and Linux sandbox jobs, and in the advisory
      # macOS workflow (`sandbox-conformance-macos.yml`).
      - name: Report this job's GitHub token budget
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true
      # Temporary: shows which limit refused a read, from the response headers.
      - name: Print the limits of this job's GitHub reads
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          probe() {
            label=$1
            shift
            code=0
            raw=$("$@" 2>/dev/null) || code=$?
            printf '%s\n' "$raw" | tr -d '\r' | awk -v label="$label" -v code="$code" '
              NR == 1 && /^HTTP/ { status = $2; next }
              inbody { body = body $0; next }
              $0 == "" { inbody = 1; next }
              {
                i = index($0, ":")
                if (i > 0) {
                  v = substr($0, i + 1)
                  gsub(/[^A-Za-z0-9_.,-]/, "", v)
                  h[tolower(substr($0, 1, i - 1))] = v
                }
              }
              function val(k) { return (k in h && h[k] != "") ? h[k] : "-" }
              END {
                types = ""
                rest = body
                if (body ~ /"errors"/) {
                  while (match(rest, /"type":"[A-Z_]+"/)) {
                    types = (types == "" ? "" : types ",") substr(rest, RSTART + 8, RLENGTH - 9)
                    rest = substr(rest, RSTART + RLENGTH)
                  }
                }
                refused = (code != 0 || types ~ /RATE_LIMITED/) ? "yes" : "no"
                out = label " exit=" code " status=" (status == "" ? "-" : status)
                out = out " limit=" val("x-ratelimit-limit") " used=" val("x-ratelimit-used")
                out = out " remaining=" val("x-ratelimit-remaining") " reset=" val("x-ratelimit-reset")
                out = out " resource=" val("x-ratelimit-resource")
                if ("retry-after" in h) out = out " retry_after=" val("retry-after")
                if (label == "graphql") out = out " errors=" (types == "" ? "-" : types)
                print out " refused=" refused
              }'
          }
          gql=$(probe graphql gh api -i graphql -f query='query { rateLimit { limit cost used remaining resetAt } }') || true
          rest=$(probe rest gh api -i "repos/$GITHUB_REPOSITORY") || true
          echo "vinaya-limits: $gql | $rest"
          exit 0

  # Every workspace suite the shards below do not run: the Vitest packages,
  # whose native configuration, plugins and environment stay their own, and
  # the Bun suites of the sources package and the portal. The suites run one
  # after another, never at once: running every package's own test task at
  # once starved shared subprocess-spawning tests of resources, five distinct
  # tests each failing once with an identical empty-stderr signature, each
  # passing standalone.
  #
  # No docs-only skip: a documentation-only pull request runs this job too
  # (its selection decides what that costs), so `aggregate` can require it to
  # succeed — a version-2 run that defers its selected tests to this required
  # check never completes on a skipped test job.
  test-shared-packages:
    name: Test (shared packages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The test schedule's `shared` place (`scripts/test-suites/schedule.ts`):
      # every Vitest suite (`@attalabs/aeg-core`, `@attalabs/aeg-forge-state`,
      # the log server) and every Bun suite the shards do not run (the sources
      # package, the portal), each started under its own runner from its own
      # package folder, one after another — the ordering `--concurrency=1`
      # gave this job before, since running suites at once starved
      # subprocess-spawning tests. On a pull request, only the files the
      # build job's CI plan requires, plus `@attalabs/aeg-core` whole, since
      # its tests read files across the whole repository and the selection
      # does not model them, and the portal whole when the diff changes any
      # path under it. A plan that runs everything says why. A job given no
      # plan, or a plan for another tree, refuses. A push to `main` skips this
      # step and runs everything in the next one. Each runner's own report
      # must name exactly the files it was given.
      - name: Test the packages the pull request affects
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_PLAN_DECISION: ${{ needs.build.outputs.decision }}
          CI_PLAN_TESTED: ${{ needs.build.outputs.plan_tested }}
        run: |
          DECISION="$RUNNER_TEMP/decision.json"
          if [ -z "$CI_PLAN_DECISION" ] || [ "$CI_PLAN_TESTED" != "$(git rev-parse HEAD)" ]; then
            echo "This job has no CI plan for the tree it checked out; it refuses." >&2
            exit 1
          fi
          printf '%s\n' "$CI_PLAN_DECISION" > "$DECISION"
          unset CI_PLAN_DECISION CI_PLAN_TESTED
          bun scripts/test-suites/schedule.ts --run --placement shared --decision "$DECISION" --summary "$GITHUB_STEP_SUMMARY"
      - name: Test
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/test-suites/schedule.ts --run --placement shared --full --reason "a push to the default branch runs every test" --summary "$GITHUB_STEP_SUMMARY"
      - name: Report this job's GitHub token budget
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true

  # apps/cli's own suite, split across six jobs by an explicit,
  # pre-measured-balanced file list, with the kernel's and the process's Bun
  # tests assigned among them — see this file's header comment and
  # `apps/cli/tests/ci-shards.test.ts`. The job keeps its name for the readers
  # that key on it; each step summary names the owners and folders it ran.
  # Bypasses `turbo`/each package's own `test` script (which has no notion of
  # a file subset) and calls `bun test` directly with the group's files, from
  # the package's own folder — the same cwd `turbo` would have run it from,
  # and the same `--timeout=30000` the package's own script passes, so a
  # shard enforces the identical per-test ceiling the unsharded suite always
  # did. Like the shared-packages job, it runs on a documentation-only pull
  # request too: `aggregate` requires it to succeed.
  test-cli:
    name: Test (apps/cli, shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The test schedule's `shard-<n>` place (`scripts/test-suites/schedule.ts`):
      # this shard's CLI files, as its list names them, and the kernel's and
      # the process's Bun tests the schedule assigns it, each group started
      # under its own runner from its own package folder — its `bunfig.toml`
      # preload and the `--timeout=30000` its package's script passes — one
      # group after another, never Bun's parallel workers. The step summary
      # names each group's owner and folder. On a pull request, only the
      # files the build job's CI plan requires, walked to the selection's
      # full transitive depth; a plan that runs everything runs this shard's
      # whole schedule, with the reason printed. A job given no plan, or a
      # plan for another tree, refuses. A group with nothing selected starts
      # no runner, and a shard with nothing selected runs nothing and passes.
      # Each runner's own report must name exactly the files it was given. A
      # push to `main` skips this step and runs the whole schedule in the
      # next one.
      - name: Test shard ${{ matrix.shard }}'s selected files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_PLAN_DECISION: ${{ needs.build.outputs.decision }}
          CI_PLAN_TESTED: ${{ needs.build.outputs.plan_tested }}
        run: |
          DECISION="$RUNNER_TEMP/decision.json"
          if [ -z "$CI_PLAN_DECISION" ] || [ "$CI_PLAN_TESTED" != "$(git rev-parse HEAD)" ]; then
            echo "This job has no CI plan for the tree it checked out; it refuses." >&2
            exit 1
          fi
          printf '%s\n' "$CI_PLAN_DECISION" > "$DECISION"
          # The tests run under the same environment as on `main`, the job
          # token included; the plan's own variable never reaches them.
          unset CI_PLAN_DECISION CI_PLAN_TESTED
          bun scripts/test-suites/schedule.ts --run --placement shard-${{ matrix.shard }} --decision "$DECISION" --summary "$GITHUB_STEP_SUMMARY"
      - name: Test shard ${{ matrix.shard }}
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/test-suites/schedule.ts --run --placement shard-${{ matrix.shard }} --full --reason "a push to the default branch runs every test" --summary "$GITHUB_STEP_SUMMARY"
      - name: Report this job's GitHub token budget
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true

  # O1/O2/O3 (Issue #783): the pre-merge trust-anchor probe. Runs ONLY when
  # this PR's diff touches the root `vinaya.config.json` (`config_changed`
  # above), and re-runs the whole apps/cli suite with the PR's OWN
  # configuration standing in for the default branch's — so a test that
  # depends on a trust-anchored setting (the `logs` destination, `runtimeDir`,
  # the review policy) fails HERE, on the PR, instead of passing and breaking
  # the default branch the moment it merges (the `logs.url` change observed
  # 2026-09-26). The mechanism is `config.ts`'s `resolveCiTrustAnchorProbeRef`:
  # it reads the config from `VINAYA_CI_CONFIG_PROBE_REF` (the checked-out PR)
  # instead of the real default branch, and does so ONLY when this exact job's
  # three conditions hold — the ref opt-in, the Actions runner marker, and no
  # forge credential. See `apps/cli/specs/self-hosting.md`, "Proving a
  # root-configuration change before merge".
  #
  # The security guarantee is this job's shape, not just the seam's gate:
  # `permissions: contents: read` and NO `secrets.*` / `GH_TOKEN` — so it holds
  # no repository secret and no forge-write credential, and nothing it runs can
  # redirect where a real unattended run or CI delivers logs or keeps its
  # runtime files (those reads happen in credentialed `pull_request_target`
  # jobs from the default branch, which never set the probe var). With the
  # probe active the trust-anchor read is served from the local checkout, so
  # dropping the token costs the suite nothing it needed.
  test-cli-config-anchor:
    name: Test (apps/cli, root-config probe, shard ${{ matrix.shard }})
    needs: build
    if: needs.build.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
    env:
      # The checked-out ref stands in for the default branch. For a
      # `pull_request` event `actions/checkout` lands on the PR's merge commit,
      # so `HEAD:vinaya.config.json` is exactly this configuration as it will
      # exist once merged — which is what this job exists to prove.
      VINAYA_CI_CONFIG_PROBE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Deliberately no `GH_TOKEN` in this step's env — the probe read is local,
      # and the job must hold no forge credential (O2).
      # O1-O3: the explicit proof. `bun scripts/ci/config-probe.ts` runs outside
      # `bun test` (whose preload deliberately clears the runner marker), so the
      # probe guard is genuinely active in the process that reads the committed
      # base and candidate configurations through the real schema and loader.
      # Once per pull request, in shard one. The full shard runs below are
      # ordinary fixture regressions; only this step proves the candidate value.
      - name: Test committed configuration
        if: matrix.shard == 1
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: env -u GH_TOKEN -u GITHUB_TOKEN bun scripts/ci/config-probe.ts --base "$PULL_REQUEST_BASE" --candidate HEAD
      - name: Test shard ${{ matrix.shard }} with the PR's config as the trust anchor
        working-directory: apps/cli
        run: bun test --timeout=30000 $(tr '\n' ' ' < tests/ci-shards/shard-${{ matrix.shard }}.txt)
      # The same budget step as every other job, deliberately WITHOUT a token:
      # this job holds no forge credential (O2 above), so it spends no GitHub
      # budget and its failure is never a rate limit. With no token `gh`
      # refuses, prints nothing, and `|| true` keeps the job's own result.
      - name: Report this job's GitHub token budget
        if: failure()
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true

  # The sandbox conformance suite (`apps/cli/tests/sandbox-conformance/`,
  # `apps/cli/specs/isolation.md`): every command the Developer doctrine and
  # the rendered brief name, run inside Claude Code's sandbox (the sandbox
  # runtime, via `bunx`) and inside Codex's (`codex sandbox`), each set up as
  # the driver sets up a confined dispatch. A command either exits 0 under
  # both or is in the suite's known-failures list, which only shrinks.
  #
  # The CI plan decides whether a pull request runs it: when the change
  # reaches the suite through its imports or one of the paths its own
  # `SUITE_INPUTS` names — read through the test inventory's reference to
  # that list, never a copy — a doctrine or brief-template edit among them.
  # Otherwise the job is skipped, and `aggregate` accepts that skip only
  # because the plan says why. Every push to `main` runs it. No agent login —
  # both runtimes run a single command under their policy; the job token
  # only serves the suite's read-only `gh` lines.
  sandbox-conformance:
    name: Sandbox conformance (Linux)
    needs: build
    if: needs.build.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # `origin/main` is a real ref the suite's `git diff`/`git log`
          # lines name.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # What both runtimes need on Linux: bubblewrap (both), socat and
      # ripgrep (the sandbox runtime). Ubuntu 24.04 strips capabilities from
      # unprivileged user namespaces by default, which bubblewrap needs —
      # the sandbox runtime's own README names this sysctl as the remedy.
      # Host setup only; neither sandbox's policy is touched.
      - name: Install the Linux sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The tools this repository's own checks need (`ci.setup`, today
      # gitleaks), as a Developer's machine has them — so `check --all`
      # inside a sandbox fails only on what the sandbox denies.
      - name: Install the checks' own tools
        run: bun -e 'process.stdout.write(require("./vinaya.config.json").ci.setup)' | bash
      - name: Run the suite under both sandboxes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VINAYA_SANDBOX_CONFORMANCE: '1'
        working-directory: apps/cli
        run: bun test --timeout=900000 tests/sandbox-conformance/sandbox-conformance.test.ts
      - name: Report this job's GitHub token budget
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true
      # Temporary: shows which limit refused a read, from the response headers.
      - name: Print the limits of this job's GitHub reads
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          probe() {
            label=$1
            shift
            code=0
            raw=$("$@" 2>/dev/null) || code=$?
            printf '%s\n' "$raw" | tr -d '\r' | awk -v label="$label" -v code="$code" '
              NR == 1 && /^HTTP/ { status = $2; next }
              inbody { body = body $0; next }
              $0 == "" { inbody = 1; next }
              {
                i = index($0, ":")
                if (i > 0) {
                  v = substr($0, i + 1)
                  gsub(/[^A-Za-z0-9_.,-]/, "", v)
                  h[tolower(substr($0, 1, i - 1))] = v
                }
              }
              function val(k) { return (k in h && h[k] != "") ? h[k] : "-" }
              END {
                types = ""
                rest = body
                if (body ~ /"errors"/) {
                  while (match(rest, /"type":"[A-Z_]+"/)) {
                    types = (types == "" ? "" : types ",") substr(rest, RSTART + 8, RLENGTH - 9)
                    rest = substr(rest, RSTART + RLENGTH)
                  }
                }
                refused = (code != 0 || types ~ /RATE_LIMITED/) ? "yes" : "no"
                out = label " exit=" code " status=" (status == "" ? "-" : status)
                out = out " limit=" val("x-ratelimit-limit") " used=" val("x-ratelimit-used")
                out = out " remaining=" val("x-ratelimit-remaining") " reset=" val("x-ratelimit-reset")
                out = out " resource=" val("x-ratelimit-resource")
                if ("retry-after" in h) out = out " retry_after=" val("retry-after")
                if (label == "graphql") out = out " errors=" (types == "" ? "-" : types)
                print out " refused=" refused
              }'
          }
          gql=$(probe graphql gh api -i graphql -f query='query { rateLimit { limit cost used remaining resetAt } }') || true
          rest=$(probe rest gh api -i "repos/$GITHUB_REPOSITORY") || true
          echo "vinaya-limits: $gql | $rest"
          exit 0

  # The one job branch protection should require. Depends on every job
  # above and reports under the historical "Vinaya CI" name (`run-name`
  # left unset — the JOB name is what a required-check setting matches),
  # so sharding the work behind it never means sharding, renaming, or
  # multiplying the required check every adopter's branch protection
  # already keys on. `if: always()` — this must still run (and
  # fail loudly) when an upstream job fails, never be skipped alongside it.
  # The build and both test jobs must succeed: failed, cancelled or skipped
  # all refuse. Then the build job's CI plan must exist, be valid, be bound
  # to this pull request's head and to the tree this run tested, and run
  # everything whenever the base guard asked it to. The root-config probe and
  # the Linux sandbox suite must succeed when the plan requires them; a skip
  # is accepted only when the plan does not. The macOS sandbox suite runs
  # in its own advisory workflow, never among `needs`. On a push to
  # `main`, a failed job is also compared with the shadow pull-request plan:
  # one outside it is flagged for investigation — a lead, never proof the
  # selection missed it.
  aggregate:
    name: Vinaya CI
    needs: [build, test-shared-packages, test-cli, test-cli-config-anchor, sandbox-conformance]
    if: always()
    runs-on: ubuntu-latest
    # Least-privilege, matching every other job in this file — this job does
    # no checkout and runs no PR-controlled content, so it needs no more than
    # the default read scope, made explicit rather than left implicit.
    permissions:
      contents: read
    steps:
      - name: Every mandatory job succeeded and every job the CI plan requires succeeded
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          PLAN_IDENTITY: ${{ needs.build.outputs.plan_identity }}
          PLAN_VALID: ${{ needs.build.outputs.plan_valid }}
          PLAN_SCOPE: ${{ needs.build.outputs.plan_scope }}
          PLAN_HEAD: ${{ needs.build.outputs.plan_head }}
          PLAN_TESTED: ${{ needs.build.outputs.plan_tested }}
          GUARD_VERDICT: ${{ needs.build.outputs.guard_verdict }}
          REQUIRED_JOBS: ${{ needs.build.outputs.required_jobs }}
          SHADOW_STATE: ${{ needs.build.outputs.shadow_state }}
          SHADOW_JOBS: ${{ needs.build.outputs.shadow_jobs }}
          BUILD: ${{ needs.build.result }}
          TEST_SHARED_PACKAGES: ${{ needs.test-shared-packages.result }}
          TEST_CLI: ${{ needs.test-cli.result }}
          TEST_CLI_CONFIG_ANCHOR: ${{ needs.test-cli-config-anchor.result }}
          SANDBOX_CONFORMANCE: ${{ needs.sandbox-conformance.result }}
        run: |
          refuse() {
            echo "$1" >&2
            echo "vinaya-needs: $2"
            exit 1
          }
          if [ "$EVENT" = "push" ]; then
            for pair in "build=$BUILD" "test-shared-packages=$TEST_SHARED_PACKAGES" "test-cli=$TEST_CLI" "test-cli-config-anchor=$TEST_CLI_CONFIG_ANCHOR" "sandbox-conformance=$SANDBOX_CONFORMANCE"; do
              job=${pair%%=*}
              ended=${pair#*=}
              if [ "$ended" != "success" ] && [ "$ended" != "skipped" ]; then
                if [ "$SHADOW_STATE" != "available" ]; then
                  echo "vinaya-shadow: $job ended $ended; no shadow plan to compare, inconclusive"
                elif [ -n "$(echo " $SHADOW_JOBS " | grep -F " $job ")" ]; then
                  echo "vinaya-shadow: $job ended $ended inside the shadow pull-request plan"
                else
                  echo "vinaya-shadow: $job ended $ended outside the shadow pull-request plan; investigate whether the selection would have missed it"
                fi
              fi
            done
          fi
          for result in "$BUILD" "$TEST_SHARED_PACKAGES" "$TEST_CLI"; do
            if [ "$result" != "success" ]; then
              echo "A mandatory job did not succeed: $result" >&2
              # The review loop reads this line: this job's only failure is
              # an upstream job's result, whose own log names the cause.
              echo "vinaya-needs: a required job ended $result"
              exit 1
            fi
          done
          if [ -z "$PLAN_IDENTITY" ] || [ "$PLAN_VALID" != "true" ]; then
            refuse "The build job's CI plan is missing or invalid." "the CI plan is missing or invalid"
          fi
          if [ "$PLAN_HEAD" != "$HEAD_SHA" ] || [ "$PLAN_TESTED" != "$TESTED_SHA" ]; then
            refuse "The CI plan is for head $PLAN_HEAD and tree $PLAN_TESTED, not $HEAD_SHA and $TESTED_SHA." "the CI plan is bound to another head or tree"
          fi
          if [ "$GUARD_VERDICT" != "plan" ] && [ "$PLAN_SCOPE" != "full" ]; then
            refuse "The base guard asked for everything, yet the plan narrowed." "the CI plan narrowed against the base guard"
          fi
          for job in build test-cli test-shared-packages aggregate; do
            if [ -z "$(echo " $REQUIRED_JOBS " | grep -F " $job ")" ]; then
              refuse "The CI plan does not require $job, which every run requires." "the CI plan drops a mandatory job"
            fi
          done
          for pair in "test-cli-config-anchor=$TEST_CLI_CONFIG_ANCHOR" "sandbox-conformance=$SANDBOX_CONFORMANCE"; do
            job=${pair%%=*}
            result=${pair#*=}
            if [ -n "$(echo " $REQUIRED_JOBS " | grep -F " $job ")" ]; then
              if [ "$result" != "success" ]; then
                echo "The CI plan requires $job, which ended $result." >&2
                echo "vinaya-needs: a required job ended $result"
                exit 1
              fi
            elif [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "$job, which the CI plan does not require, ended $result." >&2
              echo "vinaya-needs: a required job ended $result"
              exit 1
            fi
          done
          echo "The CI plan $PLAN_IDENTITY ($PLAN_SCOPE) is valid for this head and tree, and every job it requires succeeded."
      - name: Report this job's GitHub token budget
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '.resources as $r | "vinaya-budget: exhausted=\(if $r.core.remaining == 0 then "core" elif $r.graphql.remaining == 0 then "graphql" else "none" end) core_remaining=\($r.core.remaining) core_reset=\($r.core.reset) graphql_remaining=\($r.graphql.remaining) graphql_reset=\($r.graphql.reset)"' || true
