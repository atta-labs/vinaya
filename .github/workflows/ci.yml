# This repo's own ring-1 lint/typecheck/test gate — hand-written, not
# vinaya-generated, not vinaya-managed, invisible to `doctor` by design.
# The four vinaya-*.yml workflows in this directory run `vinaya check` /
# `archive` / `audit`; none of them ever ran a test or a typecheck (#933).
#
# Runs unscoped (no --affected, no --filter): the suite is ~1-2 minutes and
# scoping has hidden failures here before.
#
# This job also builds the CLI once and uploads it as the `vinaya-cli-dist`
# artifact (O2) — the exact name `CLI_DIST_ARTIFACT_NAME` in
# `apps/cli/src/lib/artifacts.ts` names — so the sibling `pull_request`
# workflow `vinaya-checks.yml` downloads it instead of building its own copy.
# Both run at the same trust level (untrusted PR content), so sharing here
# crosses no boundary; see `apps/cli/specs/self-hosting.md`.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-test:
    name: Vinaya CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several aeg-core tests (the coherence oracle's
          # golden-comparison and origin/main diffing) resolve `origin/main`
          # as a real ref — the default shallow, single-branch checkout
          # never fetches it, and those tests fail with "origin/main does
          # not resolve" even though they pass locally. Unrelated to
          # --affected (this job stays unscoped) — needed regardless.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # O1: restores Bun's install cache, keyed on the lockfile, before the
      # install below — same key shape `bunInstallCacheStep()`
      # (`apps/cli/src/lib/artifacts.ts`) emits in every generated workflow.
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # O2: built once here, uploaded below, and downloaded by
      # `vinaya-checks.yml` instead of that workflow building its own copy.
      - name: Build the Vinaya CLI
        run: bun run --cwd apps/cli build

      - name: Upload the shared CLI build
        uses: actions/upload-artifact@v4
        with:
          name: vinaya-cli-dist
          path: apps/cli/dist
          retention-days: 1

      # Biome was a devDependency every contributor already installed, and
      # nothing ever ran it — so formatting and lint drifted in whenever a
      # contributor did not run it by hand. `check` is formatter + linter in
      # one pass over the whole repo; it takes ~150ms, so there is no reason
      # to scope it. Deliberately BEFORE typecheck: a formatting failure is
      # the cheapest and most mechanical one to read, and reporting it first
      # keeps it from being buried under type errors.
      #
      # No `--write` here. CI reports; the contributor fixes with
      # `bunx biome check --write .` locally. A CI job that rewrites the tree
      # would be pushing to a PR branch, which is not this gate's job.
      - name: Lint and format
        run: bunx biome check .

      - name: Typecheck
        run: bunx turbo typecheck

      - name: Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx turbo test --concurrency=1
