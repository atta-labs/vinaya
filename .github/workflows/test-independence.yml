# The nightly test independence check: does any test file's result depend on
# what else is running beside it?
#
# For every CI placement of the test schedule (`scripts/test-suites/schedule.ts`)
# — the build job's repository suite, the shared packages and each CLI shard —
# one job runs `scripts/test-suites/independence-check.ts`, which runs every
# file of that placement's full schedule once one file at a time and once
# eight at a time on the same commit, and names each file whose result
# differs between the two passes, with both outcomes, in the job summary. A
# file that fails in both passes is listed as failing, not as dependent, and
# does not by itself fail the job.
#
# It is a nightly check, not a merge gate: it runs on a schedule against the
# default branch and by hand, never on a pull request, and the CI workflow
# (`ci.yml`) and its jobs are untouched by it.
name: Test independence

on:
  schedule:
    # Every night, 19:17 UTC.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-independence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independence:
    name: Test independence (${{ matrix.placement }})
    runs-on: ubuntu-latest
    # 240 minutes. No CI test job sets a limit, so its shards run under
    # GitHub's 360-minute default; a CI shard on the default branch runs its
    # files one at a time, as this job's first pass does, and the longest one
    # is budgeted here at 90 minutes, the eight-at-a-time pass at no more
    # than that again: 2 x 90 = 180. Each pass may also stop one hung file at
    # the 15-minute per-file limit (`GROUP_TIME_LIMIT_MS`) and run it once
    # more: 2 x 2 x 15 = 60. 180 + 60 = 240.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        placement: [build, shared, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6]
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, as the CI test jobs check out: several tests resolve
          # `origin/main` as a real ref.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The CI build job builds the CLI before it runs the repository suite;
      # the build placement does the same.
      - name: Build the Vinaya CLI for the repository suite
        if: matrix.placement == 'build'
        run: bun run --cwd apps/cli build
      - name: Run every file alone and eight at a time and compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/test-suites/independence-check.ts --placement ${{ matrix.placement }} --summary "$GITHUB_STEP_SUMMARY"
