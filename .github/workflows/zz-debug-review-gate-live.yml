name: ZZ Debug review-gate live
on:
  push:
    branches: [fix/review-gate-graphql-workflowrun]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Build the CLI from THIS branch (the actual fix)
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd apps/cli build
      - name: Run the real review-gate check, real constrained token, against PR 343
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: 343
        run: |
          set +e
          node apps/cli/dist/index.js check review-gate
          echo "REAL_EXIT_CODE=$?"
