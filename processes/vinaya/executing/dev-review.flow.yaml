schema_version: "2.0"
id: vinaya-dev-review
display_name: Vinaya developer review
description: One task from prepared inputs to a reviewed pull request ready for merge.
experimental: true
benchmarked: false
defaults:
  model: process-supplied
agents:
  - role: developer
  - role: code-reviewer
  - role: security-reviewer
steps:
  - { id: prepare-run, type: mechanical, action: vinaya.prepare-run }
  - { id: reconcile-external-state, type: mechanical, action: vinaya.reconcile-external-state }
  - { id: prepare-sources, type: mechanical, action: vinaya.prepare-sources }
  # A Flow decision branches back to a prior step on true and forward on false, so the Developer is listed before the
  # decision that routes to it: true (no pull request is open yet) develops, false (one is) attaches at the gates.
  - id: develop
    type: agent
    role: developer
    prompt_template: "Develop the task {{question}}."
    permission: developer/grants.yaml
    working_directory: "."
    max_turns: 200
    depends_on: [choose-start]
  - id: choose-start
    type: mechanical
    action: vinaya.choose-start
    depends_on: [prepare-sources]
    decision: { examine: reconcile-external-state, if_true: develop, if_false: run-mechanical-gates, max_revisions: 3 }
  # Every round outcome below is the shared assessment's (`assessRound`): each deciding step records the observation
  # it built and the decision the assessment returned, and the decision only routes on it. Exit 1 sends the run back
  # (to the Developer, or to the reviewers' dispatch); a pause halts the run through the handoff and routes where its
  # resume continues. The checked-in ceilings are placeholders: the runner renders this Flow into the run's own folder
  # with every `max_revisions` set to the review policy's `maxRounds` before the run starts.
  - { id: validate-developer-output, type: mechanical, action: vinaya.validate-developer-output, depends_on: [develop] }
  - id: classify-developer-output
    type: mechanical
    action: vinaya.classify-developer-output
    decision: { examine: validate-developer-output, if_true: develop, if_false: run-mechanical-gates, max_revisions: 3 }
  - { id: run-mechanical-gates, type: mechanical, action: harness.run-gates }
  # The forge gates, in the standalone round order, before the gate is assessed and any reviewer is dispatched:
  # mergeability first (a conflicting head goes back to the Developer before any CI wait), then the forge's CI
  # (waited on while pending; a red read is part of the gate the assessment judges), then the premise re-check (a
  # stale pin pauses through the handoff).
  - { id: check-mergeability, type: mechanical, action: vinaya.check-mergeability }
  - id: classify-mergeability
    type: mechanical
    action: vinaya.classify-mergeability
    decision: { examine: check-mergeability, if_true: develop, if_false: read-forge-ci, max_revisions: 3 }
  - { id: read-forge-ci, type: mechanical, action: vinaya.read-forge-ci }
  - { id: check-premise, type: mechanical, action: vinaya.check-premise }
  - { id: assess-gate, type: mechanical, action: vinaya.assess-gate }
  - id: classify-gate-result
    type: mechanical
    action: vinaya.classify-gate-result
    decision: { examine: assess-gate, if_true: develop, if_false: run-security-scan, max_revisions: 3 }
  # The configured agent-configuration scan runs here, outside both reviewers' sandboxes, before either is dispatched.
  - { id: run-security-scan, type: mechanical, action: vinaya.run-security-scan }
  - { id: dispatch-reviewers, type: mechanical, action: vinaya.dispatch-reviewers }
  - id: code-review
    type: agent
    role: code-reviewer
    prompt_template: "Review the task {{question}}."
    permission: code-reviewer/grants.yaml
    working_directory: "."
    max_turns: 100
    depends_on: [dispatch-reviewers]
  - id: security-review
    type: agent
    role: security-reviewer
    prompt_template: "Security-review the task {{question}}."
    permission: security-reviewer/grants.yaml
    working_directory: "."
    max_turns: 100
    depends_on: [dispatch-reviewers]
  - { id: validate-reviewer-outputs, type: mechanical, action: vinaya.validate-reviewer-outputs, depends_on: [code-review, security-review] }
  - id: classify-reviewer-outputs
    type: mechanical
    action: vinaya.classify-reviewer-outputs
    decision: { examine: validate-reviewer-outputs, if_true: dispatch-reviewers, if_false: assess-round, max_revisions: 3 }
  - { id: assess-round, type: mechanical, action: vinaya.assess-round }
  - id: build-revision-handoff
    type: mechanical
    action: vinaya.build-revision-handoff
    decision: { examine: assess-round, if_true: develop, if_false: run-live-checks, max_revisions: 3 }
  # Both reviewers approved: the task's [live] Test Plan lines run on the approved head before it is published.
  - { id: run-live-checks, type: mechanical, action: vinaya.run-live-checks }
  - id: classify-live-result
    type: mechanical
    action: vinaya.classify-live-result
    decision: { examine: run-live-checks, if_true: develop, if_false: publish-ready-for-merge, max_revisions: 3 }
  - { id: publish-ready-for-merge, type: mechanical, action: harness.publish }
