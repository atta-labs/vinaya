role: developer
# The role's capability contract. It names what the role may do, never a vendor's tools: each agent
# adapter maps it to its own built-ins (harness/adapters/agents/README.md), and denies every built-in
# no allowed capability names.
# Per vendor only because a model id names one vendor's model; process-supplied leaves it to the run.
models: { claude: process-supplied, codex: process-supplied }
capabilities:
  read_files: allow
  # Command rules are plain command prefixes: "git push" refuses `git push …`; a trailing * also matches a
  # longer first word ("sudo*" refuses `sudoedit`). Each adapter renders them in its own rule syntax.
  run_commands:
    default: allow
    allow: ["git worktree add", "git worktree list", "git fetch", "git pull", "git status", "git diff", "git log", "git show", "git add", "git commit", "git config", "git branch", "git checkout", "git merge", "git rebase", "bun install", "bun run", "bun test", "bun packages/aeg-core/bin/verify-dispatch.ts", "bun packages/aeg-core/bin/verify-docs.ts", "bun packages/aeg-core/bin/verify-task.ts", "bun apps/cli/src/index.ts"]
    deny: ["git push", "gh", "git commit --no-verify*", "git commit -n*", "git stash*", "git reset --hard*", "rm -rf*", "sudo*", "security", "launchctl", "defaults", "systemsetup", "networksetup", "pmset", "dscl", "crontab", "chsh", "git config --global", "git config --system", "sudo"]
  write_files: ["${WORKTREE}", "${SCRATCH}", "${BUN_INSTALL_CACHE}", "${GIT_COMMON_DIR}"]
  network: [github.com, api.github.com, raw.githubusercontent.com, codeload.github.com, objects.githubusercontent.com, registry.npmjs.org, api.anthropic.com]
  web_fetch: allow
  web_search: deny
  subagents: allow
  plan_tool: allow
  view_image: allow
mcp_tools:
  vinaya_dev_tools: [fetch_documentation, run_checks, publish_changes, open_pull_request, update_pull_request_body, refresh_evidence, read_pull_request]
hooks: { background_shell: true, force_push: true, no_verify: true, default_branch_commit: true, write_scope: true }
sandbox: enabled
