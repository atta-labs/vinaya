role: developer
vendor:
  claude: { model: process-supplied }
  codex: { model: process-supplied }
tools:
  builtins: &builtins
    Agent: allow
    AskUserQuestion: deny
    Bash: allow
    Edit: allow
    EnterPlanMode: deny
    ExitPlanMode: deny
    Glob: allow
    Grep: allow
    KillShell: allow
    NotebookEdit: allow
    Read: allow
    Skill: allow
    Task: allow
    TaskOutput: allow
    TodoWrite: allow
    WebFetch: allow
    WebSearch: deny
    Write: allow
  mcp:
    vinaya_dev_tools: [fetch_documentation, run_checks, publish_changes, open_pull_request, update_pull_request_body, refresh_evidence, read_pull_request]
shell:
  allow: ["Bash(git worktree add:*)", "Bash(git worktree list:*)", "Bash(git fetch:*)", "Bash(git pull:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git config:*)", "Bash(git branch:*)", "Bash(git checkout:*)", "Bash(git merge:*)", "Bash(git rebase:*)", "Bash(bun install:*)", "Bash(bun run:*)", "Bash(bun test:*)", "Bash(bun packages/aeg-core/bin/verify-dispatch.ts:*)", "Bash(bun packages/aeg-core/bin/verify-docs.ts:*)", "Bash(bun packages/aeg-core/bin/verify-task.ts:*)", "Bash(bun apps/cli/src/index.ts:*)"]
  deny: &developer_denies ["Bash(git push:*)", "Bash(gh:*)", "Bash(git commit --no-verify*)", "Bash(git commit -n*)", "Bash(git stash*)", "Bash(git reset --hard*)", "Bash(rm -rf*)", "Bash(sudo*)", "Bash(security:*)", "Bash(launchctl:*)", "Bash(defaults:*)", "Bash(systemsetup:*)", "Bash(networksetup:*)", "Bash(pmset:*)", "Bash(dscl:*)", "Bash(crontab:*)", "Bash(chsh:*)", "Bash(git config --global:*)", "Bash(git config --system:*)", "Bash(sudo:*)"]
writable_roots: ["${WORKTREE}", "${SCRATCH}", "${BUN_INSTALL_CACHE}", "${GIT_COMMON_DIR}"]
network_domains: [github.com, api.github.com, raw.githubusercontent.com, codeload.github.com, objects.githubusercontent.com, registry.npmjs.org, api.anthropic.com]
hooks: { background_shell: true, force_push: true, no_verify: true, default_branch_commit: true, write_scope: true }
sandbox: { claude: enabled, codex: workspace-write }
