<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinaya Process Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: narrative and simulations on the left, a full-height 3D scene pinned on the right with the Log rail docked over its foot. Dark-first. Stage palette from the document. */
:root{
  --bg:#0a0a0b; --panel:#131316; --sunk:#1b1b1f; --fg:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --strong:#52525b;
  --primary:#38bdf8; --think:#38bdf8; --exec:#fb923c; --retro:#a3e635; --hot:#fb7185; --ok:#4ade80;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --top:52px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ffffff; --panel:#fafafa; --sunk:#f4f4f5; --fg:#0a0a0a; --muted:#6b6b73; --line:#e4e4e7; --strong:#a1a1aa;
  --primary:#0284c7; --think:#0369a1; --exec:#c2410c; --retro:#4d7c0f; --hot:#be123c; --ok:#15803d; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#ffffff; --panel:#fafafa; --sunk:#f4f4f5; --fg:#0a0a0a; --muted:#6b6b73; --line:#e4e4e7; --strong:#a1a1aa;
  --primary:#0284c7; --think:#0369a1; --exec:#c2410c; --retro:#4d7c0f; --hot:#be123c; --ok:#15803d; color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--strong)}
.btn.primary{background:var(--c,var(--primary));border-color:transparent;color:#0a0a0b}
.btn.small{font-size:12px;padding:5px 10px}
.btn:focus-visible,.choice:focus-visible,.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:14px;height:var(--top);padding-inline:16px}
.wordmark{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.02em}
.wordmark small{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.18em;color:var(--muted)}
.spacer{flex:1}
.crumbs{display:none;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
@media(min-width:900px){.crumbs{display:flex}}
.crumbs span{padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.crumbs span.on{color:var(--c);border-color:var(--c)}

/* two-column shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100dvh - var(--top))}
.left{padding:0 16px 0 16px;min-width:0}
.right{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--top) - env(safe-area-inset-top,0px));min-width:0;border-left:1px solid var(--line);background:var(--panel);overflow:hidden}
.right canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--muted)}
.pill.lit{color:var(--c);border-color:var(--c)}
.rail{position:absolute;left:14px;right:14px;bottom:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;height:176px;overflow:hidden}
.rail .eyebrow{display:flex;justify-content:space-between}
.rail ol{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:11.5px;display:grid;gap:3px}
.rail li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;opacity:0;transform:translateY(6px);animation:in .3s forwards}
.rail li b{font-weight:500;color:var(--c,var(--fg));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail li span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@keyframes in{to{opacity:1;transform:none}}
.gates3{position:absolute;right:14px;top:12px;display:grid;gap:6px}
.gate{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--muted);display:flex;gap:8px;align-items:center}
.gate i{width:8px;height:8px;border-radius:50%;background:var(--strong);display:inline-block}
.gate.on{color:var(--ok);border-color:var(--ok)}.gate.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.gate.run{color:var(--exec);border-color:var(--exec)}.gate.run i{background:var(--exec);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.3}}

/* scenes on the left */
.scene{min-height:calc(100dvh - var(--top));display:grid;align-content:center;gap:16px;padding-block:48px;max-width:620px;opacity:.35;transition:opacity .35s}
.scene.on{opacity:1}
.scene.done{opacity:.6}
.scene h2{font-size:clamp(24px,3vw,34px);line-height:1.12;font-weight:700;letter-spacing:-.02em}
.scene p{margin:0;color:var(--muted);max-width:58ch}
.scene .eyebrow{color:var(--c)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.intro h1{font-size:clamp(30px,4.4vw,46px);line-height:1.06;font-weight:700;letter-spacing:-.02em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.choice{text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--fg);cursor:pointer;display:grid;gap:6px;transition:border-color .2s,transform .2s}
.choice:hover{border-color:var(--strong);transform:translateY(-1px)}
.choice[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.choice .tag{font-family:var(--mono);font-size:11px;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.choice b{font-weight:600}.choice span{font-size:13px;color:var(--muted)}

/* simulated surfaces */
.win{background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:12.5px}
.win .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}
.win .bar i{width:10px;height:10px;border-radius:50%;background:var(--strong);display:inline-block}
.win .bar .t{margin-left:6px}
.win .body{padding:12px;display:grid;gap:5px;min-height:120px;max-height:380px;overflow:auto}
.ln{opacity:0;animation:in .25s forwards;white-space:pre-wrap;word-break:break-word;min-width:0}
.ln.cmd{color:var(--fg)}.ln.cmd::before{content:"$ ";color:var(--muted)}
.ln.skill{color:var(--think)}
.ln.me{color:var(--fg)}.ln.me::before{content:"you  ";color:var(--muted)}
.ln.ag{color:var(--muted)}.ln.ag::before{content:attr(data-who) "  ";color:var(--c)}
.ln.out{color:var(--muted)}
.ln.ok{color:var(--ok)}.ln.ok::before{content:"✓ "}
.ln.hook{color:var(--exec)}
.ln.ev{color:var(--primary)}
.ln.hl{color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-family:var(--mono);font-size:12px;display:grid;gap:6px}
.card .k{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.card table{width:100%;border-collapse:collapse}
.card th,.card td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-weight:400}
.card th{color:var(--muted);font-size:11px}
.card td.s{color:var(--c)}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.tasks i{font-style:normal;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tasks i.run{border-color:var(--exec);color:var(--exec)}.tasks i.done{border-color:var(--retro);color:var(--retro)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:6px 12px;background:transparent;border:0;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.stats b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.proposal{display:grid;gap:8px}
.proposal .card{grid-template-columns:1fr auto;align-items:center}
.proposal .card.ok{border-color:var(--retro)}
.note{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--c);border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--c) 10%,var(--panel));display:grid;gap:4px}
.banner b{font-weight:600}
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.sheet{width:min(960px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.map{width:100%;height:auto;font-family:var(--mono)}
.map text{fill:var(--muted);font-size:10px}
.map .box{fill:var(--sunk);stroke:var(--line)}
.map .box.path{stroke:var(--c);stroke-width:1.6}
.map .box.now{fill:color-mix(in srgb,var(--c) 18%,var(--sunk));stroke:var(--c);stroke-width:2}
.map .box.now + text,.map .box.path + text{fill:var(--fg)}
.map .edge{stroke:var(--line);fill:none}.map .edge.path{stroke:var(--c);stroke-width:1.6}
.map .lane{fill:none;stroke:var(--line);stroke-dasharray:3 3}
table.studio{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.studio th,.studio td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.studio th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.studio td.s{color:var(--c)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .right{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:38dvh;border-left:0;border-bottom:1px solid var(--line);z-index:5;order:-1}
  .rail{height:96px;left:8px;right:8px;bottom:8px}
  .scene{min-height:auto;padding-block:36px}
}
@media (prefers-reduced-motion:reduce){ .rail li,.ln{animation:none;opacity:1;transform:none} html{scroll-behavior:auto} }
</style>

<header class="top"><div class="in">
  <div class="wordmark">Vinaya <small>PROCESS · INTERACTIVE</small></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <button class="btn small" id="btnMap">Map</button>
  <button class="btn small" id="btnStudio">Studio</button>
</div></header>

<div class="shell">
  <div class="left" id="left"></div>
  <div class="right" id="right">
    <canvas id="c"></canvas>
    <div class="hud"><span class="pill lit" id="hudStage">upstream</span><span class="pill" id="hudFlow">pick a size</span></div>
    <div class="gates3"><span class="gate" id="g0"><i></i>Ring 0 · hooks</span><span class="gate" id="g1"><i></i>Ring 1 · CI</span><span class="gate" id="g2"><i></i>Ring 2 · audit</span></div>
    <div class="rail"><div class="eyebrow"><span>The Log · live</span><span id="railCount">0 events</span></div><ol id="rail"></ol></div>
  </div>
</div>

<div class="overlay" id="mapOverlay" hidden><div class="sheet">
  <header><strong>Map</strong><span class="note" id="mapNote"></span><div class="spacer"></div><button class="btn small" data-close>Close</button></header>
  <svg class="map" id="map" viewBox="0 0 900 330" aria-label="The Vinaya process, current path highlighted"></svg>
</div></div>
<div class="overlay" id="studioOverlay" hidden><div class="sheet">
  <header><strong>Studio · Mission Control</strong><span class="note">what it shows at this moment · example data</span><div class="spacer"></div><button class="btn small" data-close>Close</button></header>
  <table class="studio"><thead><tr><th>Task</th><th>Issue</th><th>PR</th><th>State</th><th>Round</th><th>Phase</th><th>Gate</th></tr></thead><tbody id="studioBody"></tbody></table>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
/* =========================================================
   DATA · one flow per choice; every scene renders from data
   ========================================================= */
const COL={think:'--think',exec:'--exec',retro:'--retro',hot:'--hot',log:'--primary'};
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SPEED=1;

/* --- chat scripts (accelerated conversations). who: me | ag | skill | cmd | out --- */
const architectChat=[
  ['cmd','claude'],['out','Claude Code · atta-labs/shop · main'],
  ['cmd','/vinaya architect'],['skill','▸ doctrine loaded: architect · reads Project specs, sets the execution Milestone, drafts tranche intents, never plans tasks'],
  ['me','Project: Checkout v2. Specs are in Linear. Retried webhooks double-charge customers today.'],
  ['ag','Read the three specs and billing/. The webhook handler has no idempotency; the retry ledger spec and the receipts spec both depend on it.'],
  ['ag','Code direction: one execution Milestone, checkout-v2, integration branch milestone/checkout-v2. Two tranches: idempotent webhooks first, retry ledger and receipts behind it.'],
  ['me','Receipts can wait. Keep two tranches, move receipts to the second.'],
  ['ag','Done. Milestone opened on the forge with two tranche intents. Nothing planned yet; that is the Planner’s.'],
];
const plannerChat=(intent,tranche,tasks)=>[
  ['cmd','claude'],['cmd','/vinaya planner'],['skill','▸ doctrine loaded: planner · reads real specs and real code, declares Surface, dependencies and conflicts, asks before writing'],
  ['me',intent],
  ['ag','Read the code first. '+tasks.length+' tasks, each with a Surface it owns and a test plan the Developer can run. Two of them touch billing/charge.ts, so they run serially.'],
  ['ag','Every claim about the code is a file:line excerpt. Dispatch order follows the dependency edges.'],
  ['me','Approved. Write them.'],
  ['ag','Tranche '+tranche+' written: '+tasks.map(t=>'#'+t.issue).join(', ')+'. Briefs frozen. Ready for the Operator.'],
];
const backlogChat=[
  ['cmd','claude'],['cmd','/vinaya planner'],['skill','▸ doctrine loaded: planner · backlog Issue: lighter planning, no tranche'],
  ['me','Found while working: resume accepts kept work from a previous run. It should refuse it.'],
  ['ag','Read apps/cli/src/commands/resume.ts. One objective, one Surface, one test. No tranche needed; it goes to the backlog.'],
  ['ag','Issue #1000 written with its brief. Dispatchable on its own.'],
];
const hotChat=(agent)=>[
  ['cmd',agent==='Codex'?'codex':'claude'],['out',(agent==='Codex'?'Codex':'Claude Code')+' · atta-labs/shop · hot/1001-flaky-cli-test'],
  ['me','The CLI test is flaky on CI. Fix it. Hot Issue #1001 is open with the files.'],
  ['ag','Race on the temp dir: two tests share TMPDIR. Patched to a per-test directory. Tests green locally.'],
  ['me','Looks right. Commit and push.'],
];
const hotExec=[
  ['cmd','git commit -m "Fix(cli): A flaky test gets its own temp dir"'],
  ['hook','pre-commit · biome check --staged'],['ok','biome · 2 files'],
  ['hook','pre-commit · turbo typecheck --affected'],['ok','typecheck · 1 package'],
  ['hook','pre-commit · vinaya check --all --diff-only --local'],['ok','31 checks · 0 failed'],
  ['cmd','git push -u origin hot/1001-flaky-cli-test'],
  ['hook','pre-push · vinaya check --all --local'],['ok','38 checks · 0 failed · Ring 0 green'],
  ['hook','pre-push · selected tests'],['ok','12 tests · 0 failed'],
  ['out','Pull request #1472 opened · Closes #1001'],
  ['hook','CI · vinaya-checks · Ring 1'],['ok','38 checks · 0 failed · merge unblocked'],
  ['out','review: waived by the Principal for this Issue'],
  ['ok','merged by the Principal · #1472 → main'],
];
/* --- execution: one reusable script per task; type planned | backlog --- */
const execScript=(t,agent)=>[
  ['cmd',t.tranche?`vinaya task run ${t.tranche} ${t.n} --agent ${agent}`:`vinaya task run --issue ${t.issue} --agent ${agent}`,{log:['dev_review_loop.loop_started',`#${t.issue}`]}],
  ['out',`brief frozen · #${t.issue} · ${t.title}`,{log:['forge_write.written','op=issue.comment · brief']}],
  ['ev',`round 1 · dispatch developer (${agent}, sandboxed)`,{log:['dispatch.dispatched','role=developer'],s3:{orbit:1,round:1}}],
  ['out',`  tool · Read ${t.file}`],['out',`  tool · Edit ${t.file}`],['out','  tool · Bash bun test'],
  ['hook','  pre-commit · biome · typecheck · check --diff-only'],['ok','  commit · 31 checks · 0 failed',{log:['gate.summary','host=hook ran=31 failed=0'],g:[1,0,0]}],
  ['hook','  pre-push · check --all --local · typecheck --affected · selected tests'],['ok','  push · Ring 0 green',{log:['gate.summary','host=hook ran=38 failed=0'],g:[2,0,0]}],
  ['out',`  pull request opened · Closes #${t.issue}`,{log:['dev_review_loop.round_started','round=1 · pr opened'],g:[2,1,0]}],
  ['ok','  CI · Ring 1 · 38 checks green',{log:['gate.summary','host=ci ran=38 failed=0'],g:[2,2,0]}],
  ['ev','  reviewers · 2 fresh, parallel, judging the head',{log:['dispatch.dispatched','role=reviewer ×2']}],
  ['out','  reviewer-1 · APPROVE · 0 findings',{log:['dev_review_loop.verdicts_read','APPROVE · APPROVE']}],
  ['out','  reviewer-2 · APPROVE · 1 minor, outside Surface'],
  ['ok',`  round 1 ended · green`,{log:['dev_review_loop.round_ended','outcome=green'],s3:{orbit:0}}],
  ['ok',`  merged by the Principal · #${t.issue} → ${t.base}`,{log:['forge_write.written','op=pr.merge'],g:[2,2,1]}],
  ['out',`  Ring 2 · audit scheduled · archivist closes #${t.issue}`,{log:['forge_write.written','op=archive · task_closed'],g:[2,2,2]}],
];

const T=(issue,n,title,file,tranche,base)=>({issue,n,title,file,tranche,base});
const FLOWS={
  feature:{label:'A new, large feature',tag:'Architect + Planner',color:'think',desc:'Specs from a Project or Epic. An execution Milestone, then tranches of tasks.',
    tranches:[{name:'checkout-v2/1',intent:'Tranche intent 1: idempotent webhooks. Milestone checkout-v2.',tasks:[T(418,1,'Idempotency key on the webhook','billing/webhook.ts','checkout-v2/1','milestone/checkout-v2'),T(419,2,'Store the key: migration + column','billing/charge.ts','checkout-v2/1','milestone/checkout-v2'),T(420,3,'Refuse a replayed charge','billing/charge.ts','checkout-v2/1','milestone/checkout-v2')]},
              {name:'checkout-v2/2',intent:'Tranche intent 2: retry ledger and receipts. Milestone checkout-v2.',tasks:[T(422,1,'Retry ledger table','billing/ledger.ts','checkout-v2/2','milestone/checkout-v2'),T(423,2,'Receipt per settled charge','billing/receipt.ts','checkout-v2/2','milestone/checkout-v2'),T(424,3,'Ledger view in the admin','admin/ledger.tsx','checkout-v2/2','milestone/checkout-v2')]}]},
  medium:{label:'Medium work',tag:'Planner · standalone tranche',color:'think',desc:'A refactor or a small feature. Several tasks, no Milestone above it.',
    tranches:[{name:'resume-hardening/1',intent:'Engineering need: resume must read the record, not memory. Three tasks, no Milestone.',tasks:[T(610,1,'Resume reads the record','apps/cli/src/commands/resume.ts','resume-hardening/1','main'),T(611,2,'A pause names who must act','packages/aeg-core/src/loop/pause.ts','resume-hardening/1','main'),T(612,3,'A ruling binds to the head it judged','packages/aeg-core/src/loop/ruling.ts','resume-hardening/1','main')]}]},
  backlog:{label:'A backlog Issue',tag:'Planner · one Issue',color:'think',desc:'Found while working. One fix, lighter planning, no tranche.',
    tranches:[{name:null,tasks:[T(1000,null,'Resume refuses kept work','apps/cli/src/commands/resume.ts',null,'main')]}]},
  hot:{label:'A hot fix, on main now',tag:'No Planner',color:'hot',desc:'You and one agent, live. Light brief. Same gates.'},
};

/* =========================================================
   SCENE BUILDERS · each returns {el, play()}; play resolves when done
   ========================================================= */
let flowKey=null, agent='claude', scenes=[], current=0;
const left=document.getElementById('left');
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};
function win(title,kind){const w=h('div','win');w.innerHTML=`<div class="bar"><i></i><i></i><i></i><span class="t">${title}</span></div><div class="body"></div>`;w.body=w.querySelector('.body');w.dataset.kind=kind||'';return w}
async function type(w,lines,speed,onLine){
  for(const [cls,text,meta] of lines){
    const l=h('div','ln '+cls,text);if(cls==='ag')l.dataset.who=agent==='codex'?'codex':'claude';

  function render(dt,once){t+=dt;const k=once?1:.05;cur.pos.lerp(T.pos,k);cur.look.lerp(T.look,k*1.2);cam.position.copy(cur.pos);cam.lookAt(cur.look);
    const loopU=order.indexOf('loop')/(order.length-1),archU=order.indexOf('archive')/(order.length-1),planU=order.indexOf('planner')/(order.length-1);
    trav.forEach(tr=>{let u;const done=tr.i<S.done;if(S.stage==='planner'||S.stage==='architect')u=planU-tr.i*.015;else if(S.stage==='loop')u=done?archU:(tr.i===S.done?loopU+Math.sin(t*1.5+tr.ph)*.02:planU+ .04-tr.i*.015);else u=archU+(S.closed?.02:0)-tr.i*.012;
      u=Math.max(0,Math.min(1,u));const p=curve.getPointAt(u);tr.m.position.copy(p).add(new THREE.Vector3(0,.3+Math.sin(t*2+tr.ph)*.05,0));tr.m.material.color.copy(done||S.closed?hex('retro'):S.hot?hex('hot'):hex('think'))});
    const sp=S.orbit?2.2:.12;sats.forEach(s=>{s.userData.a+=sp*dt;s.position.set(Math.cos(s.userData.a)*s.userData.rad,0,Math.sin(s.userData.a)*s.userData.rad)});
    const n=nodes[S.stage]||nodes.upstream;const kk=1+Math.sin(t*4)*.15;n.ring.scale.set(kk,kk,kk);Object.values(nodes).forEach(x=>x.ring.lookAt(cam.position));
    gateM.forEach((g,j)=>{g.rotation.z+=dt*(.25+j*.12)*(S.gates[j]===1?4:1)});
    mile.lookAt(cam.position);box.rotation.y+=dt*.15;
    r.render(sc,cam)}
  function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  addEventListener('resize',resize);resize();
  let last=performance.now();(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;render(dt);requestAnimationFrame(loop)})(last);
  return{focus,set,gates:gatesSet,reset};
})();

const MAP=[{k:'upstream',x:20,y:130,w:110,h:60,l:'Linear / Jira / need'},{k:'architect',x:160,y:40,w:120,h:56,l:'Architect · Milestone'},{k:'planner',x:160,y:116,w:120,h:56,l:'Planner · tranche / Issue'},{k:'hot',x:160,y:196,w:120,h:56,l:'Hot Issue · no Planner'},{k:'loop',x:320,y:70,w:150,h:70,l:'Dev–Review loop · Engine'},{k:'hotmode',x:320,y:180,w:150,h:56,l:'Hot mode · dev + agent'},{k:'gates',x:500,y:110,w:120,h:70,l:'Ring 0 · 1 · 2'},{k:'merge',x:650,y:110,w:90,h:70,l:'Merge · Principal'},{k:'archive',x:770,y:110,w:110,h:70,l:'Archivist · close'},{k:'observed',x:320,y:270,w:300,h:44,l:'The Log · Studio · Mission Control'},{k:'improve',x:650,y:270,w:230,h:44,l:'Improver · proposals back to product'}];
const EDGES=[['upstream','architect'],['upstream','planner'],['upstream','hot'],['architect','planner'],['planner','loop'],['hot','hotmode'],['loop','gates'],['hotmode','gates'],['gates','merge'],['merge','archive'],['archive','improve'],['improve','upstream']];
const pathFor={feature:['upstream','architect','planner','loop','gates','merge','archive','observed','improve'],medium:['upstream','planner','loop','gates','merge','archive','observed','improve'],backlog:['upstream','planner','loop','gates','merge','archive','observed','improve'],hot:['upstream','hot','hotmode','gates','merge','archive','observed','improve']};
function drawMap(){const svg=document.getElementById('map');const path=pathFor[flowKey];const s=scenes[current];let now=s.stage;if(flowKey==='hot'){if(now==='architect')now='hot';if(now==='loop')now='hotmode'}
  svg.style.setProperty('--c',`var(${COL[FLOWS[flowKey].color]})`);const c=k=>MAP.find(m=>m.k===k);let out='';
  out+=`<rect class="lane" x="150" y="20" width="140" height="240" rx="8"/><text x="156" y="14">STAGE 1 · THINKING</text><rect class="lane" x="310" y="20" width="440" height="240" rx="8"/><text x="316" y="14">STAGE 2 · EXECUTING</text><rect class="lane" x="760" y="20" width="130" height="240" rx="8"/><text x="766" y="14">STAGE 3</text>`;
  EDGES.forEach(([a,b])=>{const A=c(a),B=c(b);const on=(path.indexOf(b)===path.indexOf(a)+1)||(a==='improve'&&b==='upstream');const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2;const d=a==='improve'?`M${A.x} ${A.y+A.h/2} C ${A.x-40} ${A.y+60}, ${B.x+B.w/2} 330, ${B.x+B.w/2} ${B.y+B.h}`:`M${x1} ${y1} C ${x1+20} ${y1}, ${x2-20} ${y2}, ${x2} ${y2}`;out+=`<path class="edge ${on?'path':''}" d="${d}"/>`});
  MAP.forEach(m=>{const st=m.k===now?'now':path.includes(m.k)?'path':'';out+=`<rect class="box ${st}" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="6"/><text x="${m.x+8}" y="${m.y+m.h/2+4}">${m.l}</text>`});
  svg.innerHTML=out;document.getElementById('mapNote').textContent=`${FLOWS[flowKey].label} · now: ${now}`}
function drawStudio(){const tb=document.getElementById('studioBody');const F=FLOWS[flowKey];const col=`var(${COL[F.color]})`;const rows=[];
  const st=scenes[current].stage;const chips={};document.querySelectorAll('.tasks i[id]').forEach(i=>chips[i.id.slice(2)]=i.className);
  (F.tranches||[{name:'hot',tasks:[{issue:1001,n:null,title:'Fix flaky CLI test'}]}]).forEach(tr=>tr.tasks.forEach(t=>{const c=chips[t.issue]||'';const state=c==='done'?'published · merged':c==='run'?'running':st==='upstream'?'—':'frozen · not started';rows.push(`<tr><td>${tr.name?'['+tr.name+'] '+t.n:'—'}</td><td>#${t.issue}</td><td>${c==='done'?'#'+(t.issue+1050):'—'}</td><td class="s" style="--c:${col}">${state}</td><td>${c?'1':'—'}</td><td>${c==='run'?'developing':c==='done'?'done':'—'}</td><td>${c==='done'?'green':c==='run'?'ring 0':'—'}</td></tr>`)}));
  tb.innerHTML=rows.join('')}
const mapO=document.getElementById('mapOverlay'),stO=document.getElementById('studioOverlay');
document.getElementById('btnMap').addEventListener('click',()=>{mapO.hidden=false;drawMap()});

addEventListener('keydown',e=>{if(e.key==='Escape'){mapO.hidden=true;stO.hidden=true}});
